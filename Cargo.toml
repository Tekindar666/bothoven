[package]
name = "bothoven"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", features = [
  "client",
  "standard_framework",
  "voice",
] }
songbird = { version = "0.5", features = [
  "builtin-queue",
  "serenity",
  "rustls",
] }
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3"] }
tokio = { version = "1.21.2", features = [
  "fs",
  "macros",
  "process",
  "rt-multi-thread",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
